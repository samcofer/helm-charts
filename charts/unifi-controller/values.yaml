image:
  repository: linuxserver/unifi-controller
  pullPolicy: IfNotPresent
  tag: 

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# These keys are rendered verbatim as container env var names, so they must match the
# names the LinuxServer image actually reads (TZ/PUID/PGID/MEM_LIMIT/MEM_STARTUP). The old
# camelCase keys (timezone/uid/gid/memLimit/memStartup) were silently ignored by the image.
environment:
  - TZ: "Europe/Berlin"
  - PUID: 1000
  - PGID: 1000
  - MEM_LIMIT: 1920    # -Xmx; keep this a little below the resource limits
  - MEM_STARTUP: 1024  # -Xms; set this roughly to the resource requests

service:
  type: "ClusterIP"
  annotations: {}
    # traefik.ingress.kubernetes.io/service.serversscheme: https
  ports:
    devicecom: 8080
    webapi: 8443
  appDiscovery: false
  syslogCapture: false
  loadBalancerIP: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: unifi.speedport.ip
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - unifi.speedport.ip


# if set, use this persistant volume claim for the internal mongodb
persistence:
  enabled: true
  accessMode: ReadWriteOnce 
  size: 8Gi 
  ## database data Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  storageClass: local-path-retain
  annotations: {}
  backup:
    enabled: true
    accessMode: ReadWriteOnce 
    size: 8Gi 
    ## database data Persistent Volume Storage Class
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    storageClass: local-path-retain
    annotations: {}



podSecurityContext: {}
  # runAsUser: 999
  # fsGroup: 999

securityContext: {}
#  capabilities:
#     drop:
#     - ALL
#  readOnlyRootFilesystem: false
#  runAsNonRoot: true
#  runAsUser: 999

resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 1Gi

# The UniFi Java app can take 1-2 minutes to bind :8080 on a cold boot (Mongo + config
# init, more so on network/NFS-backed storage). A startupProbe holds liveness/readiness
# off until the app is up, so a slow boot is not converted into a liveness kill + crash
# loop. failureThreshold * periodSeconds is the total warmup budget (default 5 min).
startupProbe:
  enabled: true
  tcpSocket:
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 30
  timeoutSeconds: 3

readinessProbe:
  tcpSocket:
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  tcpSocket:
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20


nodeSelector: {}
  #unifi-controller/enabled: "true"          

tolerations: []

affinity: {}
